<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supeesu2 Helm — The Long Voyage</title><style>
:root{--amber:#e7bc7e;--ink:#091922;--aqua:#77b9b3;--muted:#a2b5ac}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030a12;color:var(--amber);font-family:Georgia,serif}button{font:inherit;cursor:pointer;color:inherit}#space{position:fixed;inset:0;width:100%;height:100%}#scene{position:fixed;inset:0;overflow:hidden;perspective:950px;pointer-events:none}#room{position:absolute;inset:0;filter:drop-shadow(0 12px 18px #0008);transition:filter 2s}#room svg{width:100%;height:100%;display:block}#light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 96%,rgba(90,176,157,.18),transparent 55%);transition:background 2s}body.night #light{background:radial-gradient(ellipse at 50% 91%,rgba(207,65,21,.32),transparent 57%),linear-gradient(0deg,rgba(113,27,9,.14),transparent 65%)}body.night #room{filter:sepia(.32) saturate(1.3) drop-shadow(0 12px 18px #0008)}#ui{position:absolute;inset:0;pointer-events:none}#ui>*{pointer-events:auto}.hud{position:absolute;left:5.5%;top:15%;width:min(330px,34vw);padding:23px 27px 28px;clip-path:polygon(0 0,83% 0,100% 18%,100% 100%,7% 100%,0 88%);background:linear-gradient(130deg,#3a7a7a38,#071d2dc4 65%,#10333a88);border-left:1px solid #b5d4b16b;box-shadow:inset 0 0 32px #6ac2ac17;backdrop-filter:blur(6px)}.hud:before{content:'';position:absolute;top:0;left:0;width:75%;height:1px;background:linear-gradient(90deg,#e1b77a,transparent)}.eyebrow{font:11px/1.4 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#c6ad82}.time{font-size:clamp(32px,4.2vw,62px);line-height:1.3;text-shadow:0 0 19px #efb86d3c}.sub{font:12px/1.7 system-ui,sans-serif;color:#c4d2c4}.hud button{background:none;border:0;padding:0;text-align:left;border-bottom:1px solid #c49a6470;color:#eac58e}.hud button:hover{color:#fff1d0}.date{margin-bottom:10px}.info{margin-top:13px;padding-top:12px;border-top:1px solid #a2c2ae48}.info strong{display:block;font-size:19px;font-weight:normal;margin:5px 0}.crystalButton{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:170px;height:190px;background:none;border:0;filter:drop-shadow(0 0 20px #e4aa6b55);transition:filter .3s,transform .3s}.crystalButton:hover{transform:translateX(-50%) translateY(-8px);filter:drop-shadow(0 0 31px #ffca7d99)}.crystalButton svg{width:100%;height:100%;animation:hoverstone 6s ease-in-out infinite}.crystalButton span{position:absolute;bottom:-7px;left:0;right:0;font:10px system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#e9c18e;text-shadow:0 1px 8px #000}@keyframes hoverstone{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}.minimap{position:absolute;right:5.5%;top:18%;width:min(250px,25vw);height:195px;background:linear-gradient(135deg,#16383d77,#071923cc);clip-path:polygon(11% 0,100% 0,100% 88%,90% 100%,0 100%,0 15%);border-right:1px solid #ba9b70a6;backdrop-filter:blur(4px);padding:16px;transition:transform .3s}.minimap:hover{transform:translateY(-5px)}.minimap svg{width:100%;height:120px}.minimap small{font:10px system-ui,sans-serif;letter-spacing:.18em}.status{position:absolute;bottom:5%;right:5%;font:10px system-ui,sans-serif;letter-spacing:.16em;text-align:right;color:#c3aa86;text-shadow:0 2px 8px #000}.status div{margin-top:6px}.panel{position:absolute;inset:0;display:none;place-items:center;background:#030d17b9;backdrop-filter:blur(8px)}.panel.open{display:grid}.sheet{width:min(680px,90vw);max-height:85vh;overflow:auto;padding:30px 35px;background:linear-gradient(125deg,#20434aee,#071923f5 70%);clip-path:polygon(0 0,93% 0,100% 8%,100% 100%,6% 100%,0 93%);box-shadow:0 15px 60px #0009;outline:1px solid #8bafaa}.sheet h2{font-weight:normal;font-size:35px;margin:6px 0 12px}.sheet p{color:#c5d2c6;font:14px/1.7 system-ui,sans-serif}.close{float:right;background:none;border:1px solid #a98b60;padding:7px 12px;font:12px system-ui,sans-serif}.sheet label{display:block;font:12px system-ui,sans-serif;margin:14px 0 5px;color:#d2b68b}.sheet input,.sheet select{width:100%;padding:10px;background:#09242b;color:#e5c28f;border:1px solid #7d9e95;font:15px system-ui,sans-serif}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button{background:#284e4e;border:1px solid #9d8d69;padding:10px 17px;font:13px system-ui,sans-serif}.actions button:hover{background:#39605b}.sheet svg{max-width:100%}body.night .hud,body.night .minimap{background:linear-gradient(135deg,#5b2e244a,#0b1824dc)}@media(max-width:750px){.hud{top:10%;left:3%;width:58%;padding:14px}.minimap{right:3%;top:11%;width:34%;height:140px;padding:9px}.minimap svg{height:85px}.time{font-size:31px}.crystalButton{bottom:12%;width:135px}.status{bottom:2%;font-size:8px}}
</style><link rel="stylesheet" href="long-voyage.css"></head><body><canvas id="space"></canvas><div id="scene"><div id="room"><svg viewBox="0 0 1200 760" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="stone" x2="1" y2="1"><stop stop-color="#294e52"/><stop offset=".48" stop-color="#436b68"/><stop offset="1" stop-color="#102a35"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#395a57"/><stop offset="1" stop-color="#0b1a26"/></linearGradient><radialGradient id="warm"><stop stop-color="#d4a36a" stop-opacity=".7"/><stop offset="1" stop-color="#c57b35" stop-opacity="0"/></radialGradient></defs><path d="M0 0H1200V130Q1030 110 960 55H240Q170 110 0 130Z" fill="url(#stone)"/><path d="M0 0H110L190 760H0Z M1200 0H1090L1010 760H1200Z" fill="url(#stone)"/><path d="M0 530Q600 455 1200 530V760H0Z" fill="url(#floor)"/><path d="M120 0Q160 350 190 540M1080 0Q1040 350 1010 540" stroke="#a5b9a0" stroke-width="9" fill="none" opacity=".55"/><path d="M120 0Q160 350 190 540M1080 0Q1040 350 1010 540" stroke="#102a30" stroke-width="34" fill="none" opacity=".55"/><path d="M0 550Q600 470 1200 550" stroke="#b5a47d" stroke-width="5" fill="none" opacity=".6"/><path d="M0 635Q600 505 1200 635" stroke="#7ba8a0" stroke-width="3" fill="none" opacity=".65"/><ellipse cx="600" cy="712" rx="440" ry="105" fill="#163e47" stroke="#a6a37c" stroke-width="7"/><ellipse cx="600" cy="705" rx="340" ry="65" fill="#4b8583" opacity=".32"/><path d="M140 760L390 550H810L1060 760" fill="#12303a" opacity=".8"/><path d="M360 760L470 570H730L840 760" fill="none" stroke="#9a9673" stroke-width="3" opacity=".7"/><ellipse cx="600" cy="650" rx="160" ry="25" fill="#091e2a" stroke="#b49a68" stroke-width="7"/><ellipse cx="600" cy="645" rx="120" ry="16" fill="#3c7976" opacity=".65"/><ellipse cx="600" cy="645" rx="80" ry="10" fill="#bca779" opacity=".3"/><ellipse cx="160" cy="590" rx="200" ry="140" fill="url(#warm)" opacity=".25"/><ellipse cx="1040" cy="590" rx="200" ry="140" fill="url(#warm)" opacity=".25"/><path d="M0 0H1200" stroke="#d7b88d" stroke-width="6" opacity=".5"/></svg></div><div id="light"></div></div><div id="ui"><section class="hud"><button id="date" class="date eyebrow" title="Open today's view">FRIDAY · OCTOBER 30</button><div class="time" id="clock">10:06 PM</div><div class="sub" id="moment">A moment between things</div><div class="info"><div class="eyebrow">Next ritual</div><strong>Evening reset</strong><div class="sub">10:30 PM · Start hot water · Turn off orb lights</div></div></section><button class="minimap" id="mapBtn" title="Open celestial map"><small>CELESTIAL CHART</small><svg viewBox="0 0 220 120"><defs><radialGradient id="mapglow"><stop stop-color="#d9c48e" stop-opacity=".7"/><stop offset="1" stop-color="#d9c48e" stop-opacity="0"/></radialGradient></defs><circle cx="108" cy="59" r="54" stroke="#7eaca7" stroke-opacity=".5" fill="none"/><ellipse cx="108" cy="59" rx="91" ry="29" transform="rotate(-18 108 59)" stroke="#a99b79" fill="none" opacity=".8"/><circle cx="108" cy="59" r="28" fill="url(#mapglow)"/><circle cx="108" cy="59" r="5" fill="#e9c58d"/><circle cx="45" cy="81" r="4" fill="#8cc7b5"/><circle cx="178" cy="34" r="3" fill="#d6ad79"/><circle cx="162" cy="89" r="3" fill="#94a9d3"/><path d="M45 81L108 59L178 34" stroke="#91aaa0" stroke-dasharray="2 5" fill="none"/></svg></button><button class="crystalButton" id="crystalBtn" aria-label="Open planning crystal"><svg viewBox="0 0 160 180"><defs><linearGradient id="cryst" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f1cb8d"/><stop offset=".34" stop-color="#ab6537"/><stop offset=".7" stop-color="#7c4b36"/><stop offset="1" stop-color="#e8a35f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs><ellipse cx="80" cy="145" rx="45" ry="9" fill="#e0a85b" opacity=".6" filter="url(#glow)"/><path d="M79 10L118 40L127 105L84 137L38 103L46 38Z" fill="url(#cryst)" stroke="#f2d09b" stroke-width="2"/><path d="M79 10L84 137L46 38Z" fill="#e7b579" opacity=".44"/><path d="M79 10L118 40L84 137Z" fill="#4f302b" opacity=".65"/><path d="M38 103L84 137L127 105L95 88L65 92Z" fill="#d09c62" opacity=".55"/><path d="M46 38L95 55L118 40M95 55L84 137M65 92L95 55L127 105" fill="none" stroke="#f4d5a2" stroke-width="2" opacity=".6"/><path d="M58 45L77 35L89 55L70 74Z" fill="#f9dfac" opacity=".35"/><path d="M48 100L63 91M108 43L118 62" stroke="#fff0c2" stroke-width="3" opacity=".65"/></svg><span>Make room</span></button><div class="status"><div id="chapter">OBSERVING · DISTANT SYSTEM</div><div id="phase">LOCAL LIGHT · DAY</div></div><div class="panel" id="panel"><div class="sheet"><button class="close" id="close">Close ×</button><div class="eyebrow" id="panelTag">OBSERVATORY INSTRUMENT</div><h2 id="panelTitle">Celestial chart</h2><div id="panelBody"></div></div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('space'),ctx=canvas.getContext('2d'),TAU=Math.PI*2;let w=0,h=0,dpr=1,stars=[];const seed=(n)=>{let x=(n|0)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}};const smooth=t=>t*t*(3-2*t),lerp=(a,b,t)=>a+(b-a)*t;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const r=seed(84312);stars=Array.from({length:430},()=>({x:r(),y:r(),r:.35+r()*1.3,p:r()*TAU,layer:.1+r()*.9}))}addEventListener('resize',resize);resize();const DAY=86400000,CHAPTER=36*3600000;function sceneAt(ms){const index=Math.floor(ms/CHAPTER),r=seed(index*71231+19);const q=r();const type=q<.55?'distant':q<.8?'approach':q<.95?'orbit':'asteroids';const body=r()<.48?'ice':r()<.55?'rock':'gas';return{index,type,body,angle:r()*TAU,scale:type==='distant'?.025+r()*.045:type==='approach'?.08+r()*.09:type==='orbit'?.23+r()*.15:.05+r()*.05,x:.25+r()*.5,y:.27+r()*.24,hue:body==='ice'?210:body==='gas'?32:18,seed:Math.floor(r()*1e8),moon:r()>.48,cloud:r()>.55}}function disc(x,y,r,body,now){ctx.save();ctx.translate(x,y);const grd=ctx.createRadialGradient(-r*.3,-r*.35,r*.08,0,0,r);if(body.body==='ice'){grd.addColorStop(0,'#a5c9d9');grd.addColorStop(.4,'#396c9b');grd.addColorStop(.82,'#173b74');grd.addColorStop(1,'#06182d')}else if(body.body==='gas'){grd.addColorStop(0,'#dfb993');grd.addColorStop(.55,'#9a7866');grd.addColorStop(1,'#342d36')}else{grd.addColorStop(0,'#a8a49a');grd.addColorStop(.55,'#626b71');grd.addColorStop(1,'#202b38')}ctx.fillStyle=grd;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.clip();const rand=seed(body.seed);if(body.body==='rock'){for(let i=0;i<85;i++){const px=(rand()*2-1)*r,py=(rand()*2-1)*r,rr=(.01+rand()*.09)*r;ctx.strokeStyle=`rgba(12,20,26,${.08+rand()*.24})`;ctx.lineWidth=Math.max(.5,r*.012);ctx.beginPath();ctx.ellipse(px,py,rr,rr*(.6+rand()*.6),rand()*TAU,0,TAU);ctx.stroke()}}else{for(let i=0;i<26;i++){let yy=(rand()*2-1)*r;ctx.strokeStyle=body.body==='ice'?`rgba(196,232,248,${.025+rand()*.14})`:`rgba(240,215,176,${.03+rand()*.18})`;ctx.lineWidth=Math.max(.6,r*(.004+rand()*.024));ctx.beginPath();ctx.moveTo(-r,yy);ctx.bezierCurveTo(-r*.3,yy+Math.sin(now/1e7+i)*r*.025,r*.2,yy-r*.025,r,yy+r*.025);ctx.stroke()}}const shade=ctx.createLinearGradient(-r,0,r,0);shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(.56,'rgba(0,0,0,.12)');shade.addColorStop(1,'rgba(0,0,0,.78)');ctx.fillStyle=shade;ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();ctx.strokeStyle=body.body==='ice'?'rgba(120,189,230,.25)':'rgba(230,188,137,.12)';ctx.lineWidth=Math.max(1,r*.02);ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();ctx.restore()}
function draw(ms){ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#02070e');bg.addColorStop(.55,'#061522');bg.addColorStop(1,'#10212c');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const chapter=sceneAt(ms);const t=(ms%CHAPTER)/CHAPTER,drift=Math.sin(ms/700000)*.008,px=Math.sin(ms/410000)*w*.012,py=Math.sin(ms/510000)*h*.008;for(const s of stars){const x=(s.x*w+px*s.layer+w)%w,y=(s.y*h+py*s.layer+h)%h;const tw=.64+.36*Math.sin(ms/(1100+s.layer*2600)+s.p);ctx.fillStyle=`rgba(222,231,234,${tw*.75})`;ctx.beginPath();ctx.arc(x,y,s.r*tw,0,TAU);ctx.fill();if(s.r>1.3&&tw>.83){ctx.strokeStyle=`rgba(193,218,223,${(tw-.7)*.6})`;ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+3,y);ctx.moveTo(x,y-3);ctx.lineTo(x,y+3);ctx.stroke()}}if(chapter.cloud){const gr=ctx.createRadialGradient(w*.7,h*.33,0,w*.7,h*.33,w*.47);gr.addColorStop(0,'rgba(42,71,103,.10)');gr.addColorStop(.5,'rgba(33,55,77,.045)');gr.addColorStop(1,'rgba(20,40,62,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,w,h)}const prev=sceneAt(ms-CHAPTER),next=sceneAt(ms+CHAPTER);function bodyDraw(s,alpha,progress){ctx.save();ctx.globalAlpha=alpha;const radius=Math.min(w,h)*s.scale*(1+.07*Math.sin(progress*TAU));const x=w*s.x+Math.sin(ms/700000+s.angle)*w*.025,y=h*s.y+Math.cos(ms/1000000+s.angle)*h*.022;disc(x,y,radius,s,ms);if(s.moon){disc(x+radius*1.8,y-radius*.7,Math.max(2,radius*.12),{body:'rock',seed:s.seed+42},ms)}ctx.restore()}const fade=.14;if(t<fade){bodyDraw(prev,1-smooth(t/fade),1);bodyDraw(chapter,smooth(t/fade),t)}else if(t>1-fade){bodyDraw(chapter,1-smooth((t-(1-fade))/fade),t);bodyDraw(next,smooth((t-(1-fade))/fade),0)}else bodyDraw(chapter,1,t);if(chapter.type==='asteroids'){const r=seed(chapter.seed);for(let i=0;i<10;i++){const x=(r()*w+ms/(22000+i*2300))%(w+70)-35,y=(.18+r()*.5)*h;ctx.fillStyle='#666d70';ctx.beginPath();ctx.ellipse(x,y,2+r()*5,2+r()*3,r()*TAU,0,TAU);ctx.fill()}}document.getElementById('chapter').textContent=({distant:'OBSERVING · DISTANT SYSTEM',approach:'DRIFTING · APPROACHING WORLD',orbit:'ORBITING · CELESTIAL BODY',asteroids:'PASSING · MINOR BODIES'})[chapter.type]}
function light(){const d=new Date(),m=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;const night=m>=19*60||m<4*60+30;document.body.classList.toggle('night',night);document.getElementById('phase').textContent=night?'LOCAL LIGHT · WARM NIGHT':'LOCAL LIGHT · DAY';document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase()}function animate(){draw(Date.now());requestAnimationFrame(animate)}animate();light();setInterval(light,20000);
const panel=document.getElementById('panel');function show(title,tag,body){document.getElementById('panelTitle').textContent=title;document.getElementById('panelTag').textContent=tag;document.getElementById('panelBody').innerHTML=body;panel.classList.add('open')}document.getElementById('close').onclick=()=>panel.classList.remove('open');panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.remove('open')});document.getElementById('date').onclick=()=>show('A day aboard','TODAY',`<p>Today's details would appear on this summoned glass instrument. This is a visual prototype, not the scheduling engine.</p><p>Evening reset · 10:30 PM</p>`);document.getElementById('mapBtn').onclick=()=>show('Celestial chart','NAVIGATION',`<svg viewBox="0 0 620 250" role="img" aria-label="Decorative celestial navigation chart"><rect width="620" height="250" fill="#081d2a"/><ellipse cx="310" cy="125" rx="245" ry="74" fill="none" stroke="#85b5aa" opacity=".7"/><ellipse cx="310" cy="125" rx="180" ry="114" fill="none" stroke="#bca475" opacity=".45"/><circle cx="310" cy="125" r="37" fill="#426c78" stroke="#e3bd86"/><circle cx="100" cy="172" r="11" fill="#c6a47d"/><circle cx="485" cy="66" r="16" fill="#6e9fc4"/><circle cx="410" cy="209" r="8" fill="#a9b7a5"/><path d="M100 172L310 125L485 66" stroke="#c8ad83" stroke-dasharray="4 8" fill="none"/></svg><p>Miniature navigation instrument expanded. The next iteration can populate this with real schedule events.</p>`);document.getElementById('crystalBtn').onclick=()=>show('Make room','PLANNING CRYSTAL',`<p>The opaque amber mineral is the physical planning instrument. Its event editor will connect to Quiet Hours in a later iteration.</p><label>Event</label><input placeholder="A new appointment"><label>Occurrence</label><select><option>One-time</option><option>Recurring</option></select><div class="actions"><button onclick="document.getElementById('panel').classList.remove('open')">Return to observatory</button></div>`);window.LongVoyageUI={show,close:()=>panel.classList.remove('open')};})();

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スペース - Supeesu</title>
    <style>
        /* 1. Core Layout & Night Sky */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @font-face {
            font-family: 'hina-mincho';
            src: url('Hina-Mincho-Regular.woff');
        }

        body {
            background-color: #0c031f; /* Deep purple night sky */
            font-family: 'hina-mincho', serif;
            color: lavender;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px;
        }

        /* 2. Header (The "North Star") */
        header {
            margin-bottom: 60px;
            text-align: center;
        }

        h1 {
            color: #ffd700; /* Rich Lantern Gold */
            font-size: 52px;
            letter-spacing: 12px;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            font-weight: normal;
        }

        /* 3. Modular Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        /* 4. Tile Styling & Hover Glow */
        .tile {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.7); /* Thin white border */
            border-radius: 4px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            
            /* The "Magical" Transition */
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 200px;
        }

        .tile:hover {
            border-color: #ffd700; /* Glows gold on hover */
            background-color: rgba(255, 215, 0, 0.03); 
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.15), 
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            transform: translateY(-5px); /* Subtle float effect */
        }

        /* 5. Minimalist Search Bar */
        .search-wrapper {
            width: 100%;
        }

        #search-input {
            width: 100%;
            padding: 15px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid lavender; 
            color: white;
            font-size: 24px;
            font-family: 'hina-mincho', serif;
            outline: none;
            transition: all 0.4s ease;
        }

        #search-input:focus {
            border-bottom-color: #ffd700;
            padding-left: 12px;
        }

        .engine-toggle {
            margin-top: 25px;
            color: thistle;
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .engine-toggle label {
            margin-right: 25px;
            cursor: pointer;
        }

        .engine-toggle input[type="radio"] {
            accent-color: #ffd700;
            margin-right: 8px;
        }

        /* 6. Content Typography */
        p {
            color: thistle;
            font-size: 19px;
            line-height: 1.8;
            transition: color 0.5s ease;
        }

        .tile:hover p {
            color: white;
        }

        .lantern-accent {
            color: #ffd700;
            font-size: 14px;
            margin-top: 15px;
            display: block;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <header>
        <h1>スペース</h1>
    </header>

    <div class="grid-container">
        
        <!-- Search Tile -->
        <div class="tile">
            <div class="search-wrapper">
                <form id="search-form" action="https://www.google.com/search" method="get">
                    <input type="text" name="q" id="search-input" placeholder="探す..." autofocus autocomplete="off">
                    
                    <div class="engine-toggle">
                        <label><input type="radio" name="engine" value="google" checked> Google</label>
                        <label><input type="radio" name="engine" value="ddg"> DuckDuckGo</label>
                    </div>
                </form>
            </div>
        </div>

        <!-- Inspiration Tile -->
        <div class="tile">
            <p>これはparagraphですね。ここにインスピレーションを与える言葉を置くことができます。</p>
            <span class="lantern-accent">✦ 静かな夜に思考を巡らせる ✦</span>
        </div>

        <!-- Future Feature Tile -->
        <div class="tile" style="border-style: dashed; opacity: 0.7;">
            <p style="font-size: 16px; text-align: center;">+ 新しいモジュールを追加</p>
        </div>

    </div>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const radios = document.getElementsByName('engine');

        // Logic: Memory (Persistence)
        const savedEngine = localStorage.getItem('preferredEngine');
        if (savedEngine) {
            const radioToSelect = document.querySelector(`input[value="${savedEngine}"]`);
            if (radioToSelect) {
                radioToSelect.checked = true;
                updateAction(savedEngine);
            }
        }

        // Logic: Engine Toggle
        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                updateAction(radio.value);
                localStorage.setItem('preferredEngine', radio.value);
                input.focus();
            });
        });

        function updateAction(value) {
            form.action = (value === 'ddg') ? "https://duckduckgo.com/" : "https://www.google.com/search";
        }

        // Auto-focus on load
        window.onload = () => { input.focus(); };
    </script>

</body>
</html>

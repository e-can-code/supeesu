<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スペース - Supeesu</title>
    <style>
        /* 1. Core Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @font-face {
            font-family: 'hina-mincho';
            src: url('Hina-Mincho-Regular.woff');
        }

        body {
            background-color: #0c031f; /* Deep night sky */
            font-family: 'hina-mincho', serif;
            color: lavender;
            
            display: flex;
            flex-direction: column; /* Stack Title above Grid */
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* 2. Header Title (Floating above tiles) */
        header {
            margin-bottom: 50px;
            text-align: center;
        }

        h1 {
            color: #ffd700; /* Lantern Gold */
            font-size: 48px;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            font-weight: normal;
        }

        /* 3. Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        /* 4. Modular Tile Styling */
        .tile {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8); /* Thin white border */
            border-radius: 4px; /* Sharper, more "window" like */
            padding: 40px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 5. Search Tile Specifics */
        .search-wrapper {
            width: 100%;
        }

        #search-input {
            width: 100%;
            padding: 12px 0; /* Clean, underlined look */
            background: transparent;
            border: none;
            border-bottom: 1px solid lavender; 
            color: white;
            font-size: 22px;
            font-family: 'hina-mincho', serif;
            outline: none;
            transition: all 0.4s ease;
        }

        #search-input:focus {
            border-bottom-color: #ffd700;
            padding-left: 10px; /* Subtle movement on focus */
        }

        .engine-toggle {
            margin-top: 20px;
            color: thistle;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .engine-toggle label {
            margin-right: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .engine-toggle input[type="radio"] {
            accent-color: #ffd700;
            margin-right: 5px;
        }

        /* 6. Text Tile Content */
        p {
            color: thistle;
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
        }

        .lantern-accent {
            color: #ffd700;
            font-size: 14px;
            margin-top: 10px;
            display: block;
        }

    </style>
</head>
<body>

    <header>
        <h1>スペース</h1>
    </header>

    <div class="grid-container">
        
        <!-- Search Tile -->
        <div class="tile">
            <div class="search-wrapper">
                <form id="search-form" action="https://www.google.com/search" method="get">
                    <input type="text" name="q" id="search-input" placeholder="探す..." autofocus autocomplete="off">
                    
                    <div class="engine-toggle">
                        <label><input type="radio" name="engine" value="google" checked> Google</label>
                        <label><input type="radio" name="engine" value="ddg"> DuckDuckGo</label>
                    </div>
                </form>
            </div>
        </div>

        <!-- Content Tile -->
        <div class="tile">
            <p>これはparagraphですね。ここにインスピレーションを与える言葉を置くことができます。</p>
            <span class="lantern-accent">✦ 静かな夜に思考を巡らせる ✦</span>
        </div>

        <!-- Optional Third Tile (Ready for more modules) -->
        <div class="tile">
            <p style="opacity: 0.6;">次は、よく使うリンクや天気のモジュールを追加しましょうか？</p>
        </div>

    </div>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const radios = document.getElementsByName('engine');

        const savedEngine = localStorage.getItem('preferredEngine');
        if (savedEngine) {
            const radioToSelect = document.querySelector(`input[value="${savedEngine}"]`);
            if (radioToSelect) {
                radioToSelect.checked = true;
                updateAction(savedEngine);
            }
        }

        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                updateAction(radio.value);
                localStorage.setItem('preferredEngine', radio.value);
                input.focus();
            });
        });

        function updateAction(value) {
            form.action = (value === 'ddg') ? "https://duckduckgo.com/" : "https://www.google.com/search";
        }

        window.onload = () => { input.focus(); };
    </script>

</body>
</html>

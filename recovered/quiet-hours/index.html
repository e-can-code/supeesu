<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet Hours · The Helm</title><link rel="stylesheet" href="helm.css"></head><body>
<canvas id="stars" aria-hidden="true"></canvas><div class="world" id="world"><div class="nebula"></div><div class="arch arch-left"></div><div class="arch arch-right"></div><div class="arch arch-top"></div><div class="waterline"></div><div class="water"></div><div class="floor"></div>
<header class="topline"><div class="sigil">✧</div><div class="coordinates"><span id="dateLabel"></span><small>THE OBSERVATORY</small></div><button class="subtle" id="soundBtn" title="Toggle ambient motion">◌ &nbsp; Stillness</button></header>
<section class="welcome"><div class="eyebrow">YOUR PLACE IN TIME</div><h1 id="greeting">A quiet place<br>between the stars.</h1><p id="daySummary">The day is taking shape.</p></section>
<div class="porthole" id="porthole" role="button" tabindex="0" aria-label="Explore the star map"><div class="planet"></div><div class="ring ring-one"></div><div class="ring ring-two"></div><div class="window-caption">BEYOND THE WINDOW <span>↗</span></div></div>
<div class="helm"><div class="helm-edge"></div><section class="now-instrument"><div class="eyebrow">THE PRESENT</div><div class="instrument-time" id="clock">--:--</div><div class="now-title" id="nowTitle">Finding your place…</div><div class="progress"><div id="progressFill"></div></div></section><button class="crystal" id="createBtn" aria-label="Create an event"><span class="crystal-glow"></span><span class="crystal-core"></span><span class="crystal-label">MAKE ROOM <b>＋</b></span></button><section class="next-instrument"><div class="eyebrow">ON THE HORIZON</div><div id="upcoming"></div></section></div>
<nav class="helm-nav" aria-label="Explore"><button data-panel="today"><span>◷</span> Today</button><button data-panel="map"><span>✧</span> Star map</button><button data-panel="patterns"><span>◎</span> Constellations</button><button data-panel="operations"><span>⚙</span> Workshop</button></nav></div>
<div class="veil" id="veil" hidden></div><section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlayTitle" hidden><div class="overlay-head"><div><div class="eyebrow" id="overlayEyebrow">AN INSTRUMENT OF TIME</div><h2 id="overlayTitle">Today</h2></div><button class="close" id="closeOverlay" aria-label="Close">×</button></div><div id="overlayBody" class="overlay-body"></div></section>
<script src="helm.js"></script></body></html>
